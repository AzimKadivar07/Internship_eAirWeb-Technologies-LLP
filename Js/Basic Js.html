<body>
    <h1>Alert, Onclick property and Console Methodes</h1>
    <hr>
    <h3>Button With Alert</h3>
<button id="click" onclick="alert('hello')">Click Me</button>
    <script>
       console.log('hello');
       console.warn('This is a warning');
       console.error('There is error in code');
    </script>
</body>
