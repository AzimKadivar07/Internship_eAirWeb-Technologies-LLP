<!doctype html>
<html lang="en">

<head>
  <title>Cricket Game Final</title>
  <link rel="stylesheet" href="CricketGameFinal.css">
</head>

<body>
  <section id="sec1">
    <header>
      <h1> 🏏Cricket Game</h1>
      <hr>
      <h3> ⚔️ Choose your move and challenge the computer ⚔️</h3>
    </header>
  </section>
  <main>
    <section id="sec2">
      <div id=rules>
        <center>
          <h3> 📋 Game Rules</h3>
        </center>
        <ul>
          <li>Bat beats Ball.</li>
          <li>Ball beats Stump.</li>
          <li>Stump beats Bat.</li>
          <li>If both choose the same move, it's a Tie.</li>
          <li>Note: Your score is saved automatically</li>
        </ul>
      </div>
    </section>
    <section id="sec3">
      <div id="btn-container">
        <button class="btn" onclick="
    let batComputerChoice = getcomputerChoice();
    let batResultMsg = getResult('Bat', batComputerChoice);
    showResult('Bat', batComputerChoice, batResultMsg);
  ">
          🏏Bat
        </button>

        <button class="btn" onclick="
    let ballComputerChoice = getcomputerChoice();
    let ballResultMsg = getResult('Ball', ballComputerChoice);
    showResult('Ball', ballComputerChoice, ballResultMsg);
  ">
          
 🥎 Ball
        </button>

        <button class="btn" onclick="
    let stumpComputerChoice = getcomputerChoice();
    let stumpResultMsg = getResult('Stump', stumpComputerChoice);
    showResult('Stump', stumpComputerChoice, stumpResultMsg);
  ">
        ||| Stump
        </button>
        <button class="btn" onclick="localStorage.clear()
  resetScore();"> 🔄Reset</button>
      </div>
    </section>
    <section id="sec4">
      <h3>Score Board:</h3>
      <h3 id="user-move"></h3>
      <h3 id="computer-move"></h3>
      <h3 id="result"></h3>
      <h3 id="score"></h3>
    </section>
  </main>
  <footer>
    <p>© 2026 Azim Kadivar | All Rights Reserved</p>
  </footer>
  <script>
    
    let scoreStr = localStorage.getItem('score');
    let score;
    resetScore(scoreStr);
    function resetScore(scoreStr) {
      score = scoreStr ? JSON.parse(scoreStr) : {
        Win: 0,
        Lose: 0,
        Tie: 0,
      };
      // if (score !== undefined) {
      //   score = JSON.parse(scoreStr);

      // } else {
      // let score = {
      //     Win: 0,
      //     Lose: 0,
      //     Tie: 0,    
      // }
      // }

      score.displayScore = function () {
        return (` 🏆 Win: ${score.Win}, 😥 Lose: ${score.Lose}, 🤝 Tie: ${score.Tie}`);
      }
      showResult();
    }

    function getcomputerChoice() {
      let computerChoice;
      let randomNumber = Math.random() * 3;

      if (randomNumber > 0 && randomNumber <= 1) {
        computerChoice = 'Bat';
      } else if (randomNumber > 1 && randomNumber <= 2) {
        computerChoice = 'Ball';
      } else {
        computerChoice = 'Stump';
      }

      return computerChoice;
    }

    function getResult(userMove, ComputerMove) {

      if (userMove === 'Bat') {
        if (ComputerMove === 'Ball') {
          score.Win++;
          return 'User won.';
        } else if (ComputerMove === 'Bat') {
          score.Tie++;
          return `It's a tie`;
        } else if (ComputerMove === 'Stump') {
          score.Lose++;
          return 'Computer has won';
        }
      }

      if (userMove === 'Ball') {
        if (ComputerMove === 'Stump') {
          score.Win++;
          return 'User won.';
        } else if (ComputerMove === 'Ball') {
          score.Tie++;
          return `It's a tie`;
        } else if (ComputerMove === 'Bat') {
          score.Lose++;
          return 'Computer has won';
        }
      }

      if (userMove === 'Stump') {
        if (ComputerMove === 'Bat') {
          score.Win++;
          return 'User won.';
        } else if (ComputerMove === 'Stump') {
          score.Tie++;
          return `It's a tie`;
        } else if (ComputerMove === 'Ball') {
          score.Lose++;
          return 'Computer has won';
        }
      }
    }

    function showResult(userMove, ComputerMove, resultMsg) {
      localStorage.setItem('score', JSON.stringify(score));
      document.querySelector('#user-move').innerText =
        userMove /*!== undefined*/ ? `You have chosen ${userMove}` : '';
      document.querySelector('#computer-move').innerText =
        ComputerMove !== undefined ? `Computer choice is ${ComputerMove}` : '';
      document.querySelector('#result').innerText = resultMsg || '';
      // resultMsg !== undefined ? resultMsg : '';
      document.querySelector('#score').innerText = score.displayScore();

    }

  

  </script>
</body>

</html>
