<html lang="en">
<head>

    <style>
        body{
            background-image: url(/Assets/blub\ backgound.png);

    display: flex;

}

<body>
    <h1>Blub Turn On-Off Project With JavaScript</h1>
   <center> <img src="/Assets/on.png" id="bulb" alt="bulb on"></center>
   <div class="button-container">
    <button onclick="on()" id="turnOn" class="btn">Turn On</button>
    <button onclick="off()" id="turnOff" class="btn">Turn Off</button>
</div>
    <script>
        function on(){
            let hello = document.querySelector('#bulb').src="/Assets/on.png";
        }
            function off(){
            document.querySelector('#bulb').src="/Assets/off.png";
        }
    </script>
