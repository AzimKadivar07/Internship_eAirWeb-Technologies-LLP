<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     #container {
  display: grid;
  grid-template-columns: 100px 100px;
  grid-template-rows: 100px 100px;
}

.box1 {
  background-color: aquamarine;
  grid-row: 1 / 2;
  grid-column: 1 / 2;
}

.box2 {
  background-color: blue;
  grid-row: 1 / 2;
  grid-column: 2 / 3;
}

.box3 {
  background-color: aqua;
  grid-row: 2 / 3;
  grid-column: 1 / 2;
}

.box4 {
  background-color: blueviolet;
  grid-row: 2 / 3;
  grid-column: 2 / 3;
}

.box {
    width: 100px;
    height: 100px;
    background-color: greenyellow;
}

@media screen and (min-width: 300px) {
    .box {
        border: 5px solid red;
    }
}

.boxpro {
    width: 100px;
    height: 100px;
    background-color: rgb(255, 47, 248);
}

@media screen and (max-width: 400px) {
    .boxpro {
        border: 5px solid rgb(0, 60, 255);
        
    }
}

.boxpromax {
    width: 100px;
    height: 100px;
    background-color: rgb(255, 47, 47);
}

@media screen and (min-width: 300px) and (max-width: 400px) {
    .boxpromax {
        width: 200px;
        height: 200px;
        background-color: dodgerblue;
    }
}

  </style>
</head>
<body>
    <h1>Grid and Media Queries</h1>
    <hr>
    <h2>Grid</h2>
    <div id="container">
    <div class="box1">Box 1</div>
    <div class="box2">Box 2</div>
    <div class="box3">Box 3</div>
    <div class="box4">Box 4</div>
    </div>
    <hr>
    <h2>Media Queries</h2>
    <h3>Min-Width:300px</h3>
    <div class="box">Azim</div>
    <h3>Max-Width:400px</h3>
    <div class="boxpro">Azim</div>
     <h3> Min Width:300px and Max-Width:400px</h3>
    <div class="boxpromax">Azim</div>
</body>
</html>
