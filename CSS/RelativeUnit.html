<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative Units</title>
    <style>
        .box{
            border: 5px solid black;
            margin: 10px;
        }
        #b1{
            width: 200px;
            height: 200px;
            background-color: red;
        }
        #b2{
             width: 100px;
            height: 100px;
            background-color: green;
        }
        #b3{
            width: 200px;
            height: 200px;
            background-color: blue;
        }
        #b4{
            width: 90%;
            height: 20%;
            background-color: yellow;
        }
        #b5{
            width: 200px;
            height: 200px;
            background-color: orange;
            font-size: 20px;
        }
        #b6{
            width: 100px;
            height: 100px;
            background-color: purple;
            font-size: 2em;
        }
        body{
            font-size: 20px;
        }
        #b7{
            width: 200px;
            height: 200px;
            background-color: chartreuse;
        }
        #b8{
            width: 100px;
            height: 100px;
            background-color: beige;
            font-size: 2rem;
        }
    </style>
</head>
<body>
  <h1>CSS Relative Units</h1>  
  <hr>
  <h3>PX</h3>
  <div class="box" id="b1">
    Box1
    <div class="box" id="b2">Box2</div>
  </div>
  <br>
   <h3>Percentage</h3>
  <div class="box" id="b3">
    Box3
    <div class="box" id="b4">Box4</div>
  </div>
  <br>
    <h3>EM</h3>
  <div class="box" id="b5">
    Box5
    <div class="box" id="b6">Box6</div>
  </div>
  <br>
    <h3>REM</h3>
  <div class="box" id="b7">
    Box7
    <div class="box" id="b8">Box8</div>
  </div>
</body>
</html>
