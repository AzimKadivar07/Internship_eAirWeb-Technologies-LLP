<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float property</title>
    <style>
        #b1{
              width:400px;
              height: 200px;
              background-color: darksalmon;
              border: 5px solid black
        }
           #b2{
              width:100px;
              height: 100px;
              background-color: rgb(16, 5, 1);
              color: aliceblue;
              border: 5px solid black;
              margin: 5px;
              float: left;
        }
             #b3{
              width:400px;
              height: 200px;
              background-color: darksalmon;
              border: 5px solid black
        }
           #b4{
              width:100px;
              height: 100px;
              background-color: rgb(16, 5, 1);
              color: aliceblue;
              border: 5px solid black;
              margin: 5px;
              float: right;
        }
             #b5{
              width:400px;
              height: 200px;
              background-color: darksalmon;
              border: 5px solid black
        }
           #b6{
              width:100px;
              height: 100px;
              background-color: rgb(16, 5, 1);
              color: aliceblue;
              border: 5px solid black;
              margin: 5px;
              float: none;
        }
    </style>
</head>
<body>
    <h1>CSS Float Property</h1>
    <hr>
    <h2>Float Property</h2>
    <h3>Float:Left</h3>
    <div id="b1">Box1<div id="b2">Box2</div></div>
    <br>
    <h3>Float:Right</h3>
    <div id="b3">Box3<div id="b4">Box4</div></div>
    <h3>Float:None</h3>
    <div id="b5">Box5<div id="b6">Box6</div></div>
    
   
</body>
</html>
